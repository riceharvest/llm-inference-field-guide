# Baseline config for the Ling-3.0-tiny auto-research loop.
# Mirrors the live production service (exp001) but bound to a dedicated sweep
# port so it does NOT collide with the running ling-llama service on 12445.
name: "baseline_prod_eq"

# --- model / binary (live paths) ---
model_path: "~/models/Ling-3.0-tiny-Q4_K_M.gguf"
hf_id: "ling-3.0-tiny"
model_revision: "main"
quantization: "Q4_K_M"
server_binary: "~/llama.cpp-aetherbird/build/bin/llama-server"

# --- server bind (sweep port, NOT 12445) ---
host: "127.0.0.1"
port: 12499

# --- context / generation ---
context: 131072
n: 16384
batch: 1024
ubatch: 512
threads: 14
threads_batch: 16
ngl: 999
device: "CUDA0"
flash_attn: "auto"
kv_quant: "bf16"
load_mode: "mmap+mlock"
parallel: 4
poll: 50
poll_batch: 1
prio: 2
prio_batch: 2

# --- sampling (temp=0 for deterministic throughput) ---
temp: 0.0
top_p: 0.95
top_k: 20

# --- harness control ---
prompts_file: "scripts/auto-research-loop/templates/prompts.json"
engine_version: "aetherbird/bailingmoe3-support"
startup_timeout: 120
warmup_runs: 2
max_tokens: 1024
