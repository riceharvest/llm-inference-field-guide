# Hermes provider snippet for Gemma 4 12B QAT.
# Add under the `providers:` key in ~/.hermes/config.yaml, then run:
#   hermes chat --provider gemma4-local -m gemma-4-12b-it-qat
#
# Keep context_length below 262144 unless you drop the MTP draft head
# (the head + its CUDA buffer push a 262K slot past 12 GB VRAM).

providers:
  gemma4-local:
    api: http://127.0.0.1:1235/v1
    default_model: gemma-4-12b-it-qat
    api_key: dummy
    context_length: 196608
