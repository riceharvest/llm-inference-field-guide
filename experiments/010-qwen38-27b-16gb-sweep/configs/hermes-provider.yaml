# Hermes provider wiring for the Qwen3.8-27B local endpoint (experiment 010).
# Apply on the Vast box ONCE before running the agent-eval half of the sweep:
#
#   hermes config set providers.qwen38-local.api http://127.0.0.1:1235/v1
#   hermes config set providers.qwen38-local.default_model qwen3.8-27b
#   hermes config set providers.qwen38-local.api_key dummy
#   hermes config set providers.qwen38-local.context_length 32768
#   hermes config check
#
# Then hermesbench drives it:
#   hermesbench run --provider qwen38-local --model qwen3.8-27b \
#     --suite hermes-core --model-size 27e9 --backend llama.cpp \
#     --output-dir results/<cell> --jobs 1

providers:
  qwen38-local:
    api: http://127.0.0.1:1235/v1
    default_model: qwen3.8-27b
    api_key: dummy
    context_length: 32768
